<!DOCTYPE html>
<html>
<head>
    <title>Générateur d'icônes PWA</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #667eea; }
        .icon-row { display: flex; align-items: center; gap: 20px; margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 4px; }
        canvas { border: 1px solid #ddd; }
        .download-btn { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .download-btn:hover { background: #5568d3; }
        .info { color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Générateur d'icônes PWA</h1>
        <p>Cliquez sur les boutons pour télécharger chaque icône PNG.</p>
        <div id="icons"></div>
        <p class="info">Téléchargez tous les fichiers PNG et placez-les dans le dossier icons/ de votre PWA.</p>
    </div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 512;
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            // Draw rounded rectangle
            const radius = 100 * scale;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${128 * scale}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Hello', size / 2, size / 2);
        }
        
        const iconsContainer = document.getElementById('icons');
        
        sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            drawIcon(canvas, size);
            
            const div = document.createElement('div');
            div.className = 'icon-row';
            
            const label = document.createElement('span');
            label.textContent = `${size}x${size}`;
            label.style.width = '80px';
            
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = 'Télécharger';
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            div.appendChild(label);
            div.appendChild(canvas);
            div.appendChild(downloadBtn);
            iconsContainer.appendChild(div);
        });
    </script>
</body>
</html>
